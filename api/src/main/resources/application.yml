server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: uberhub-admin-service
              uri: http://localhost:8085
              predicates:
                - Path=/uberhub-admin-service/**


            - id: uberhub-mentorship-service
              uri: http://localhost:8084
              predicates:
                - Path=/uberhub-mentorship-service/**

            - id: uberhub-matchmaking-service
              uri: http://localhost:8083
              predicates:
                - Path=/uberhub-matchmaking-service/**

            - id: uberhub-profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/uberhub-profile-service/**

            - id: uberhub-auth-service
              uri: http://localhost:8081
              predicates:
                - Path=?uberhub-auth-service/**

          